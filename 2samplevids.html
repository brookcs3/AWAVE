<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample Videos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #222222;
            color: #F8F8F8;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            padding: 40px 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 50px;
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .videos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 40px;
            margin-bottom: 40px;
        }

        .video-card {
            background-color: #2a2a2a;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .video-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.5);
        }

        .video-player {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #1a1a1a;
        }

        .video-info {
            padding: 24px;
        }

        .video-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: #F8F8F8;
        }

        .video-description {
            font-size: 0.95rem;
            color: #b0b0b0;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .download-link {
            display: inline-block;
            padding: 10px 20px;
            background-color: #F8F8F8;
            color: #222222;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .download-link:hover {
            background-color: #e0e0e0;
        }

        footer {
            text-align: center;
            margin-top: 60px;
            padding-top: 30px;
            border-top: 1px solid #3a3a3a;
            color: #808080;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .videos-grid {
                grid-template-columns: 1fr;
                gap: 30px;
            }

            h1 {
                font-size: 1.8rem;
                margin-bottom: 30px;
            }

            .video-info {
                padding: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sample Videos</h1>

        <div class="videos-grid">
            <!-- Video 1 -->
            <div class="video-card">
                <video class="video-player" controls>
                    <source src="stemees_scroll_zoomeC.MP4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
                <div class="video-info">
                    <div class="video-title">Stemees Scroll Zoom</div>
                    <div class="video-description">
                        Experience smooth scroll and zoom animations with interactive UI elements.
                    </div>
                    <a href="stemees_scroll_zoomeC.MP4" download class="download-link">Download Video</a>
                </div>
            </div>

            <!-- Video 2 -->
            <div class="video-card">
                <video class="video-player" controls>
                    <source src="UntitledProject51854×1368-AppleDevicesHD(BestQuality)(5).m4v" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
                <div class="video-info">
                    <div class="video-title">Apple Devices HD</div>
                    <div class="video-description">
                        High-quality presentation showcasing responsive design across Apple devices.
                    </div>
                    <a href="UntitledProject51854×1368-AppleDevicesHD(BestQuality)(5).m4v" download class="download-link">Download Video</a>
                </div>
            </div>
        </div>

        <footer>
            <p>&copy; 2026 Sample Videos. All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
