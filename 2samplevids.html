<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample Videos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #222222;
            color: #F8F8F8;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            padding: 40px 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .videos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 40px;
        }

        .video-card {
            background-color: #2a2a2a;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .video-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.5);
        }

        .video-player {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #1a1a1a;
        }

        .video-info {
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .download-link {
            display: inline-block;
            padding: 10px 20px;
            background-color: #F8F8F8;
            color: #222222;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .download-link:hover {
            background-color: #e0e0e0;
        }

        @media (max-width: 768px) {
            .videos-grid {
                grid-template-columns: 1fr;
                gap: 30px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="videos-grid">
            <!-- Video 1 -->
            <div class="video-card">
                <video class="video-player" controls preload="metadata">
                    <source src="https://media.githubusercontent.com/media/brookcs3/AWAVE/main/stemees_scroll_zoomeC.MP4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
                <div class="video-info">
                    <a href="https://media.githubusercontent.com/media/brookcs3/AWAVE/main/stemees_scroll_zoomeC.MP4" download class="download-link">Download</a>
                </div>
            </div>

            <!-- Video 2 -->
            <div class="video-card">
                <video class="video-player" controls preload="metadata">
                    <source src="https://media.githubusercontent.com/media/brookcs3/AWAVE/main/UntitledProject51854%C3%971368-AppleDevicesHD(BestQuality)(5).m4v" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
                <div class="video-info">
                    <a href="https://media.githubusercontent.com/media/brookcs3/AWAVE/main/UntitledProject51854%C3%971368-AppleDevicesHD(BestQuality)(5).m4v" download class="download-link">Download</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
